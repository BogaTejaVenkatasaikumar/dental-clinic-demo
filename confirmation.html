<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Appointment Confirmed | The Zen Clinic</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet"/>

  <style>
    body { font-family: 'Manrope', sans-serif; }

</head>

<body class="bg-[#f4fbf8] flex items-center justify-center min-h-screen text-center px-6">

    <!-- Icon -->
    <div class="text-green-500 text-6xl mb-6">
      ✅
    </div>

    <!-- Heading -->
    <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">

      Our team will contact you shortly to finalize your visit.
    </p>

    <!-- Buttons -->
    <div class="flex flex-col gap-4">

      <a href="index.html"
         class="bg-teal-600 hover:bg-teal-700 text-white py-3 rounded-full font-semibold transition">
        Go to Home
      </a>

      <a href="appointment.html"
         class="border border-teal-600 text-teal-600 hover:bg-teal-50 py-3 rounded-full font-semibold transition">
